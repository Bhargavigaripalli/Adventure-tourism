<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Off Trail | Stackly Adventure Tourism</title>
    <meta name="description" content="The page you requested has strayed off the trail. Return to Stackly Adventure Tourism home base.">
    <link rel="icon" type="image/webp" href="images/logoStackly.webp">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--color-secondary); color: var(--color-text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem;">

    <!-- PRELOADER -->
    <div class="preloader" id="preloader">
        <div class="preloader-inner">
            <img src="images/logoStackly.webp" alt="Stackly Logo" class="preloader-logo" style="height: 52px; margin-bottom: 1.5rem;">
            <div class="preloader-bar-wrap">
                <div class="preloader-bar" id="plBar"></div>
            </div>
        </div>
    </div>

    <!-- 404 CONTENT -->
    <main style="width: 100%; max-width: 520px;">
        <div style="margin-bottom: 1.2rem; text-align: left;">
            <a href="javascript:history.back()" style="color: var(--color-primary-light); font-size: 0.9rem; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem;">
                ← Go Back to Previous Page
            </a>
        </div>

        <div class="glass-card" style="padding: 3rem 2rem; text-align: center;">
            <a href="index.html" style="display: inline-block; margin-bottom: 1.5rem;">
                <img src="images/logoStackly.webp" alt="Stackly Logo" class="logo-img" style="height: 48px;">
            </a>
            <div style="font-size: 5.5rem; font-family: var(--font-heading); font-weight: 900; line-height: 1; color: var(--color-primary); margin-bottom: 0.5rem;">404</div>
            <span class="subtitle">Off The Map</span>
            <h1 style="font-family: var(--font-heading); color: #FFF; font-size: 2rem; margin-top: 0.5rem; margin-bottom: 1rem;">You've Wandered Off Trail</h1>
            <p style="color: var(--color-text-muted); margin-bottom: 2rem; line-height: 1.7; font-size: 0.95rem;">
                The mountain route or expedition page you are looking for doesn't exist or has been relocated.
            </p>
            
            <div style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;">
                <button onclick="history.back()" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 0.6rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #FFF; cursor: pointer;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Go Back</span>
                </button>
                <a href="index.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 0.6rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span>Return Home</span>
                </a>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
