<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
    <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E35336"/>
            <stop offset="50%" stop-color="#F4A460"/>
            <stop offset="100%" stop-color="#A0522D"/>
        </linearGradient>
        <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Mountain Icon Mark -->
    <g transform="translate(10, 8)" filter="url(#logoGlow)">
        <!-- Outer Glowing Ring -->
        <circle cx="32" cy="32" r="30" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" opacity="0.4"/>
        <circle cx="32" cy="32" r="26" fill="rgba(227, 83, 54, 0.12)" stroke="url(#logoGrad)" stroke-width="1.5"/>

        <!-- Sun -->
        <circle cx="32" cy="18" r="4.5" fill="#F4A460"/>

        <!-- Mountain Peaks -->
        <path d="M12 48 L26 24 L36 40 L44 28 L52 48 Z" fill="url(#logoGrad)"/>
        <path d="M26 24 L32 34 L36 40 L26 24 Z" fill="#F5F5DC" opacity="0.6"/>
        <path d="M44 28 L48 36 L52 48 L44 28 Z" fill="#F5F5DC" opacity="0.4"/>
    </g>

    <!-- Brand Typography -->
    <text x="82" y="42" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="28" fill="#F5F5DC" letter-spacing="1">STACKLY</text>
    <text x="83" y="58" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9.5" fill="#F4A460" letter-spacing="3.5">ADVENTURE TOURISM</text>
</svg>
